name: Deploy Site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_ORIGIN: https://cebian.catcat.work

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 页面 lastmod 需要真实文件历史，不能使用浅克隆的边界时间。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: pnpm build

      - name: Verify SEO output
        run: pnpm test:seo

      - name: Prepare IndexNow ownership and content manifest
        run: node scripts/indexnow-cli.mjs prepare "$RUNNER_TEMP/indexnow"
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Save notification manifest
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-manifest
          path: ${{ runner.temp }}/indexnow/manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # 通知脚本只用 Node 标准库，不需要 pnpm 或包管理器缓存。
          package-manager-cache: false

      - name: Download current notification manifest
        uses: actions/download-artifact@v4
        with:
          name: indexnow-manifest
          path: ${{ runner.temp }}/indexnow

      - name: Verify live changes and notify IndexNow
        run: node scripts/indexnow-cli.mjs notify "$RUNNER_TEMP/indexnow"
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GH_TOKEN: ${{ github.token }}

      - name: Save IndexNow receipt
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt
          path: ${{ runner.temp }}/indexnow/receipt.json
          retention-days: 90
          if-no-files-found: error
